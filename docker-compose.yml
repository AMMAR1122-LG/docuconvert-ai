version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docuconvert
      POSTGRES_PASSWORD: docuconvert
      POSTGRES_DB: docuconvert
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuconvert"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://docuconvert:docuconvert@postgres:5432/docuconvert
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/storage
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://docuconvert:docuconvert@postgres:5432/docuconvert
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/storage
    depends_on:
      - redis
      - postgres
    volumes:
      - backend_storage:/app/storage
    # Not started by default in the MVP (the backend processes conversions
    # synchronously) — enable once a real queue is wired up. Left here so
    # `docker compose up worker` works the moment app/worker.py exists.
    profiles: ["queue"]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_storage:
